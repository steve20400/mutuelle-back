name: Build et demarrage du backend

# Verifie trois choses, entierement sur les serveurs de GitHub :
#   1. le projet compile avec le meme JDK que l'image Docker,
#   2. l'application demarre reellement sur PostgreSQL et cree son schema,
#   3. l'image Docker se construit, ce qui est exactement ce que fait Render.
#
# Le diagnostic est recopie dans le resume de l'execution, lisible sans se
# connecter, ce qui evite d'avoir a ouvrir les journaux detailles.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  build-et-demarrage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mutuelle_ci
          POSTGRES_USER: mutuelle_ci
          POSTGRES_PASSWORD: mutuelle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mutuelle_ci -d mutuelle_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v5

      - name: Installer le JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compiler le jar
        run: mvn -B -DskipTests package

      - name: Demarrer l'application sur PostgreSQL
        id: demarrage
        env:
          SPRING_PROFILES_ACTIVE: prod
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: mutuelle_ci
          PGUSER: mutuelle_ci
          PGPASSWORD: mutuelle_ci
          JWT_SECRET: valeur-de-test-uniquement-pour-l-integration-continue
          JWT_ACCESS_EXPIRATION: 9000000000
          JWT_REFRESH_EXPIRATION: 604800000
          SPRING_MAIL_USERNAME: ci@example.invalid
          SPRING_MAIL_PASSWORD: mot-de-passe-factice
          PORT: 8080
        run: |
          java -jar target/*.jar > demarrage.log 2>&1 &
          echo $! > app.pid
          echo "Attente de /actuator/health pendant 300 secondes au maximum"
          dernier=""
          for i in $(seq 1 100); do
            dernier=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true)
            if [ "$dernier" = "200" ]; then
              echo "resultat=demarree" >> "$GITHUB_OUTPUT"
              echo "Application demarree apres environ $((i * 3)) secondes"
              exit 0
            fi
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              echo "resultat=processus_mort" >> "$GITHUB_OUTPUT"
              echo "::error::Le processus Java s'est arrete avant de repondre"
              exit 1
            fi
            sleep 3
          done
          echo "resultat=sans_reponse" >> "$GITHUB_OUTPUT"
          echo "dernier_code=$dernier" >> "$GITHUB_OUTPUT"
          echo "::error::Delai depasse, dernier code HTTP observe : $dernier"
          exit 1

      - name: Diagnostic dans le resume
        if: always()
        run: |
          {
            echo "## Diagnostic du demarrage"
            echo
            echo "Resultat de l'etape : \`${{ steps.demarrage.outputs.resultat || 'inconnu' }}\`"
            echo
            echo "### Reponse brute de /actuator/health"
            echo '```'
            curl -s -i --max-time 10 http://localhost:8080/actuator/health 2>&1 | head -20 || echo "aucune reponse"
            echo '```'
            echo
            echo "### Ports en ecoute"
            echo '```'
            ss -ltnp 2>/dev/null | head -15 || echo "ss indisponible"
            echo '```'
            echo
            echo "### Cent dernieres lignes du journal de demarrage"
            echo '```'
            tail -100 demarrage.log 2>/dev/null || echo "journal absent"
            echo '```'
            echo
            echo "### Lignes d erreur du journal"
            echo '```'
            grep -nE "ERROR|FATAL|Caused by|Exception|Failed|Unable" demarrage.log 2>/dev/null | head -40 || echo "aucune ligne d erreur"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Etat du schema dans le resume
        if: always()
        env:
          PGPASSWORD: mutuelle_ci
        run: |
          {
            echo "### Tables presentes dans PostgreSQL"
            echo '```'
            psql -h localhost -U mutuelle_ci -d mutuelle_ci -c "\dt" 2>&1 | head -40 || echo "psql indisponible"
            echo '```'
            echo
            echo "### Comptes crees"
            echo '```'
            psql -h localhost -U mutuelle_ci -d mutuelle_ci -c "select email, role from auth_users order by email" 2>&1 | head -20 || echo "table absente"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Arreter l'application
        if: always()
        run: kill "$(cat app.pid)" 2>/dev/null || true

      - name: Construire l'image Docker comme le fait Render
        if: always()
        run: docker build -t mutuelle-back:ci .
